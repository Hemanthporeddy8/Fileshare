<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Send files of any size, directly between devices. No login. No storage.">
<title>FileShare</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2322d3ee'/><path d='M16 6v16M10 14l6-8 6 8M8 26h16' stroke='%230a0a14' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/qrcode.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070e;--bg2:#0d0d1a;
  --s:rgba(255,255,255,.04);--sh:rgba(255,255,255,.07);
  --b:rgba(255,255,255,.09);--bh:rgba(34,211,238,.4);
  --a:#22d3ee;--ad:rgba(34,211,238,.1);--ag:rgba(34,211,238,.2);
  --t:#f0f4ff;--m:#718096;--m2:#4a5568;
  --ok:#34d399;--okd:rgba(52,211,153,.08);
  --wn:#fbbf24;--wnd:rgba(251,191,36,.08);
  --er:#f87171;--erd:rgba(248,113,113,.08);
  --r:10px;--rl:16px
}
body{background:var(--bg);color:var(--t);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(rgba(34,211,238,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.025) 1px,transparent 1px);background-size:38px 38px}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem}
.box{width:100%;max-width:500px}
.card{background:var(--s);border:1px solid var(--b);border-radius:var(--rl);padding:2rem;backdrop-filter:blur(12px)}
.fade{animation:fu .3s ease}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.hdr{text-align:center;margin-bottom:2rem}
.logo{display:inline-flex;align-items:center;gap:.6rem;text-decoration:none;margin-bottom:.35rem}
.li{width:32px;height:32px;background:var(--a);border-radius:8px;display:flex;align-items:center;justify-content:center}
.li svg{width:17px;height:17px}
.ln{font-family:'Syne',sans-serif;font-size:1.25rem;font-weight:800;letter-spacing:-.02em;color:var(--t)}
.tg{font-size:.74rem;color:var(--m);letter-spacing:.05em;text-transform:uppercase}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:.75rem}
.mb{position:relative;background:var(--s);border:1px solid var(--b);border-radius:var(--rl);padding:1.75rem 1rem;cursor:pointer;text-align:center;transition:all .2s;color:var(--t)}
.mb:hover{border-color:var(--bh);background:var(--ad);transform:translateY(-2px)}
.mb .ic{font-size:2rem;margin-bottom:.5rem}
.mb .lb{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700}
.mb .sb{font-size:.72rem;color:var(--m);margin-top:.2rem}
.pills{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;margin-top:1.5rem}
.pill{background:var(--bg2);border:1px solid var(--b);border-radius:99px;padding:.28rem .75rem;font-size:.7rem;color:var(--m2)}
.btn-qmark{position:absolute;top:12px;right:12px;width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,0.06);color:var(--m);font-size:0.58rem;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all 0.15s;cursor:help;font-family:system-ui,sans-serif}
.mb:hover .btn-qmark{background:rgba(255,255,255,0.12);color:var(--t)}
.btn-qmark:hover{background:var(--a) !important;color:var(--bg) !important;transform:scale(1.15)}
.btn-qmark::before{content:attr(data-tooltip);position:absolute;bottom:140%;right:0;transform:translateY(5px);background:rgba(13,13,26,0.98);border:1px solid var(--b);color:var(--t);padding:0.55rem 0.8rem;border-radius:8px;font-size:0.68rem;width:200px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,0.5);opacity:0;pointer-events:none;transition:all 0.2s ease;z-index:1000;line-height:1.35;font-weight:normal;white-space:normal;font-family:'DM Sans',system-ui,sans-serif}
.btn-qmark:hover::before{opacity:1;transform:translateY(0)}
.btn-qmark::after{content:'';position:absolute;bottom:140%;right:3px;transform:translate(0,100%) translateY(5px);border-width:5px;border-style:solid;border-color:rgba(13,13,26,0.98) transparent transparent transparent;opacity:0;pointer-events:none;transition:all 0.2s ease;z-index:1001}
.btn-qmark:hover::after{opacity:1;transform:translate(0,100%) translateY(0)}
.dz{border:2px dashed var(--b);border-radius:var(--r);padding:2.75rem 1.5rem;text-align:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.dz::after{content:'';position:absolute;inset:0;background:var(--ad);opacity:0;transition:opacity .15s;pointer-events:none}
.dz:hover,.dz.ov{border-color:var(--a);border-style:solid}
.dz:hover::after,.dz.ov::after{opacity:1}
.dzi{width:44px;height:44px;margin:0 auto .8rem;color:var(--a);position:relative;z-index:1}
.dzt{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;position:relative;z-index:1;margin-bottom:.25rem}
.dzs{font-size:.78rem;color:var(--m2);position:relative;z-index:1}
.dzs span{color:var(--a)}
.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:.875rem 1.5rem;border:none;border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:500;cursor:pointer;transition:all .18s}
.ba{background:var(--a);color:var(--bg);font-weight:600}
.ba:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 4px 18px var(--ag)}
.ba:disabled{opacity:.4;cursor:not-allowed}
.bg{background:var(--s);color:var(--t);border:1px solid var(--b)}
.bg:hover{background:var(--sh);border-color:var(--bh)}
.bsm{padding:.38rem .8rem;font-size:.74rem;width:auto}
.mt1{margin-top:.75rem}
.cb{background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);padding:.9rem 1.1rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin:.85rem 0}
.cl{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--m2);margin-bottom:.2rem}
.cv{font-family:'IBM Plex Mono',monospace;font-size:1.75rem;font-weight:500;letter-spacing:.22em}
.qrw{background:#fff;border-radius:var(--r);padding:9px;display:inline-block;flex-shrink:0}
.qrw canvas{display:block;width:130px;height:130px}
.pw{margin:.85rem 0}
.pr{display:flex;justify-content:space-between;font-size:.73rem;color:var(--m2);margin-bottom:.4rem}
.pt{height:5px;background:var(--b);border-radius:99px;overflow:hidden}
.pf{height:100%;background:linear-gradient(90deg,var(--a),#818cf8);border-radius:99px;transition:width .1s ease}
.stl{display:flex;align-items:center;gap:.5rem;font-size:.78rem;color:var(--m2);padding:.55rem .85rem;background:var(--bg2);border:1px solid var(--b);border-radius:8px;margin:.75rem 0}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dy{background:var(--wn)}.dg{background:var(--ok)}.db{background:var(--a)}.dr{background:var(--er)}
.pu{animation:pu 1.8s ease infinite}
@keyframes pu{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.75)}}
.ci{background:var(--bg2);border:1.5px solid var(--b);border-radius:var(--r);color:var(--t);font-family:'IBM Plex Mono',monospace;font-size:1.9rem;font-weight:500;letter-spacing:.2em;text-align:center;padding:.7rem;width:100%;text-transform:uppercase;transition:border-color .15s;outline:none;margin:.85rem 0}
.ci:focus{border-color:var(--a)}
.ci::placeholder{opacity:.2}
.fr{background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);padding:.85rem .95rem;display:flex;align-items:center;gap:.85rem;margin:.85rem 0}
.fic{font-size:1.5rem;flex-shrink:0}
.fn{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--a);word-break:break-all;font-weight:500}
.fm{font-size:.7rem;color:var(--m);margin-top:.12rem}
.bdg{display:inline-flex;align-items:center;gap:.38rem;padding:.25rem .72rem;border-radius:99px;font-size:.7rem;font-weight:500}
.bok{background:var(--okd);border:1px solid rgba(52,211,153,.2);color:var(--ok)}
.binf{background:var(--ad);border:1px solid rgba(34,211,238,.2);color:var(--a)}
.bwn{background:var(--wnd);border:1px solid rgba(251,191,36,.2);color:var(--wn)}
.mtg{display:inline-flex;align-items:center;gap:.4rem;padding:.25rem .7rem;border-radius:99px;font-size:.7rem}
.mp{background:var(--okd);border:1px solid rgba(52,211,153,.2);color:var(--ok)}
.mr{background:var(--ad);border:1px solid rgba(34,211,238,.2);color:var(--a)}
.div{height:1px;background:var(--b);margin:1rem 0}
.rsb{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.slb{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--m2);margin-bottom:.45rem}
.lr{background:var(--bg2);border:1px solid var(--b);border-radius:8px;padding:.65rem .85rem;display:flex;align-items:center;gap:.5rem}
.lu{flex:1;font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dic{font-size:2.8rem;text-align:center;margin-bottom:.6rem}
footer{text-align:center;font-size:.73rem;color:var(--m2);margin-top:2rem;padding-bottom:1.5rem}
footer a{color:var(--m);text-decoration:none}
footer a:hover{color:var(--a)}
@media(max-width:460px){.card{padding:1.5rem 1.1rem}.cv{font-size:1.35rem;letter-spacing:.15em}.qr-row{flex-direction:column;align-items:center}.qrw canvas{width:150px;height:150px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="box">
    <header class="hdr">
      <a href="/" class="logo">
        <span class="li"><svg viewBox="0 0 17 17" fill="none"><path d="M8.5 1.5v11M3.5 7l5-5.5 5 5.5" stroke="#07070e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1.5 15.5h14" stroke="#07070e" stroke-width="2" stroke-linecap="round"/></svg></span>
        <span class="ln">FileShare</span>
      </a>
      <p class="tg">P2P · any size · always free</p>
    </header>
    <div id="root"></div>
    <footer>Files travel directly between browsers — never stored on a server.</footer>
  </div>
</div>
<script>
const SIG = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? `${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`
  : 'wss://fileshare-qhgn.onrender.com/ws';

let logTimer = null, logSeconds = 0;
function logD(msg) {
  console.log(msg);
  const dbg = document.getElementById('dbg');
  if (!dbg) return;
  const time = new Date().toLocaleTimeString([], { hour12: false, second: '2-digit', minute: '2-digit' });
  dbg.innerHTML += `<div>[${time}] ${msg}</div>`;
  dbg.scrollTop = dbg.scrollHeight;
}
function startTimer() {
  stopTimer();
  logSeconds = 0;
  logTimer = setInterval(() => {
    logSeconds++;
    const el = document.getElementById('timer-val');
    if (el) el.textContent = `${logSeconds}s`;
  }, 1000);
}
function stopTimer() {
  if (logTimer) {
    clearInterval(logTimer);
    logTimer = null;
  }
}

const ICE = { iceServers:[
  {urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302','stun:stun2.l.google.com:19302']},
  {urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turn:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}
]};

const CHUNK   = 256*1024;
const MAXBUF  = 8*1024*1024;
const P2P_TO  = 60000;
const CHARS   = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';

const $    = id => document.getElementById(id);
const esc  = s => (s || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
const root = () => $('root');
const fmtB = b => { if(!b)return'—'; if(b<1024)return b+' B'; if(b<1048576)return(b/1024).toFixed(1)+' KB'; if(b<1073741824)return(b/1048576).toFixed(1)+' MB'; return(b/1073741824).toFixed(2)+' GB'; };
const fmtS = s => { if(s<1024)return s.toFixed(0)+' B/s'; if(s<1048576)return(s/1024).toFixed(0)+' KB/s'; return(s/1048576).toFixed(1)+' MB/s'; };
const fmtE = s => s<60?s+'s left':s<3600?Math.round(s/60)+'m left':(s/3600).toFixed(1)+'h left';
const genC  = () => Array.from({length:6},()=>CHARS[Math.floor(Math.random()*CHARS.length)]).join('');
const mIco  = t => { if(!t)return'📁'; if(t.startsWith('image'))return'🖼️'; if(t.startsWith('video'))return'🎬'; if(t.startsWith('audio'))return'🎵'; if(t.includes('pdf'))return'📄'; if(t.includes('zip')||t.includes('tar')||t.includes('rar')||t.includes('7z'))return'📦'; if(t.startsWith('text'))return'📝'; return'📁'; };
function cpText(txt,btn){ navigator.clipboard.writeText(txt).then(()=>{ const o=btn.textContent; btn.textContent='✓'; btn.style.color='var(--ok)'; setTimeout(()=>{btn.textContent=o;btn.style.color='';},2000); }).catch(()=>{}); }
function setSt(txt,cls='dy'){ const sl=$('stl'),tx=$('stx'); if(!sl||!tx)return; sl.querySelector('.dot').className='dot '+cls+' pu'; tx.textContent=txt; }
function setProg(r,lbl,spd,eta){ const pw=$('pw'); if(!pw)return; pw.style.display='block'; $('pf').style.width=(Math.min(r,1)*100).toFixed(1)+'%'; $('pct').textContent=Math.round(r*100)+'%'; if($('pl')&&lbl)$('pl').textContent=lbl; if($('spd')&&spd!==undefined)$('spd').textContent=spd?fmtS(spd):''; if($('eta')&&eta!==undefined)$('eta').textContent=eta?fmtE(eta):''; }
function saveBlob(blob,name){ const url=URL.createObjectURL(blob); const a=Object.assign(document.createElement('a'),{href:url,download:name}); document.body.appendChild(a);a.click();document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url),60000); }

function showHome(){
  stopTimer();
  const p=new URLSearchParams(location.search);
  const qc=p.get('code')?.toUpperCase().slice(0,6);
  const ri=p.get('relay');
  const ib=p.get('inbox')?.toUpperCase().slice(0,6);
  if(ri) return startRelayRecv(ri);
  if(qc&&/^[A-Z0-9]{6}$/.test(qc)) return startRecv(qc);
  if(ib&&/^[A-Z0-9]{6}$/.test(ib)) return startInboxSender(ib);
  
  const session = getActiveSessionType();
  const sessionBanner = session ? `
    <div onclick="resumeActiveSession()" style="background:var(--ad); border:1px solid var(--a); border-radius:var(--r); padding:0.75rem 1rem; margin-bottom:1.25rem; display:flex; align-items:center; justify-content:space-between; cursor:pointer; transition:all 0.15s;" onmouseover="this.style.filter='brightness(1.15)'" onmouseout="this.style.filter=''">
      <div style="display:flex; align-items:center; gap:0.5rem;">
        <span class="dot dg pu" style="width:8px; height:8px;"></span>
        <span style="font-size:0.8rem; font-weight:500;">Active Connection: <strong>${session.code}</strong> (${session.type==='inbox'?'Inbox':session.type==='inboxsender'?'Inbox Sender':session.type==='1to1sender'?'Sender':'Receiver'})</span>
      </div>
      <span style="font-size:0.75rem; color:var(--a); font-weight:600;">Resume →</span>
    </div>
  ` : '';
  
  root().innerHTML=`
    <div class="card fade">
      ${sessionBanner}
      <div class="mg">
        <button class="mb" onclick="showSend()">
          <span class="btn-qmark" data-tooltip="Direct 1-to-1 P2P file sharing. Generates a temporary room code for a receiver to connect and download your files directly." onclick="event.stopPropagation()">?</span>
          <div class="ic">⬆️</div><div class="lb">Send File</div><div class="sb">Generate room code</div>
        </button>
        <button class="mb" onclick="showSendToInbox()">
          <span class="btn-qmark" data-tooltip="Drop files into a receiver's active Inbox. Enter their 6-character Inbox Code to stream files directly to their dashboard." onclick="event.stopPropagation()">?</span>
          <div class="ic">📤</div><div class="lb">Send to Inbox</div><div class="sb">Enter inbox code</div>
        </button>
        <button class="mb" onclick="showRecv()">
          <span class="btn-qmark" data-tooltip="Connect to a sender's room code. Enter the code they shared to establish a secure P2P stream and download their files." onclick="event.stopPropagation()">?</span>
          <div class="ic">⬇️</div><div class="lb">Receive File</div><div class="sb">Enter room code</div>
        </button>
        <button class="mb" onclick="showCreateInbox()">
          <span class="btn-qmark" data-tooltip="Host a file drop dashboard. Generates a QR code and link so multiple people can stream files directly to your device." onclick="event.stopPropagation()">?</span>
          <div class="ic">📥</div><div class="lb">Create Inbox</div><div class="sb">Get a drop dashboard</div>
        </button>
      </div>
    </div>
    <div class="pills">
      <span class="pill">🔒 End-to-end P2P</span>
      <span class="pill">⚡ Any file size</span>
      <span class="pill">🗑️ Never stored</span>
      <span class="pill">💸 Free forever</span>
    </div>`;
}

function showSend(){
  stopTimer();
  const savedNickname = localStorage.getItem('fs_nickname') || '';
  root().innerHTML=`
    <div class="card fade">
      <div class="rsb" style="margin-bottom:1.25rem">
        <span style="font-family:Syne,sans-serif;font-size:1rem;font-weight:700">Send a file</span>
        <button class="btn bg bsm" onclick="showHome()">← Back</button>
      </div>
      <div class="slb" style="margin-bottom:0.15rem">Your Nickname (Optional)</div>
      <input class="ci" id="sender-nickname" placeholder="NICKNAME (OPTIONAL)" value="${savedNickname}" style="font-size:1.1rem;letter-spacing:0.05em;padding:0.6rem;text-transform:uppercase;margin:0.4rem 0 1rem;" autocomplete="off" spellcheck="false" maxlength="15" oninput="localStorage.setItem('fs_nickname',this.value.trim())">
      
      <div class="dz" id="dz" onclick="$('fi').click()" ondragover="event.preventDefault();this.classList.add('ov')" ondragleave="this.classList.remove('ov')" ondrop="onDrop(event)">
        <div class="dzi"><svg viewBox="0 0 44 44" fill="none"><path d="M22 8v22M12 18l10-10 10 10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 36h28" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></div>
        <div class="dzt">Drop your file here</div>
        <div class="dzs">or <span>click to browse</span> — any size, any type</div>
        <input type="file" id="fi" style="display:none" onchange="onFP(event)">
      </div>
    </div>`;
}

function onDrop(e){ 
  e.preventDefault(); 
  e.currentTarget.classList.remove('ov'); 
  const f=e.dataTransfer.files?.[0]; 
  if(f) {
    const nn = ($('sender-nickname')?.value || '').trim();
    localStorage.setItem('fs_nickname', nn);
    startSend(f); 
  }
}
function onFP(e){ 
  const f=e.target.files?.[0]; 
  if(f) {
    const nn = ($('sender-nickname')?.value || '').trim();
    localStorage.setItem('fs_nickname', nn);
    startSend(f); 
  }
}

function startSend(file){
  const code=genC();
  const url=`${location.origin}${location.pathname}?code=${code}`;
  root().innerHTML=`
    <div class="card fade">
      <div class="rsb" style="margin-bottom:1rem">
        <span class="bdg binf"><span class="dot db pu"></span> Waiting for receiver</span>
        <button class="btn bg bsm" onclick="showSend()">Cancel</button>
      </div>
      <div class="fr"><span class="fic" id="fic">📁</span><div><div class="fn">${file.name}</div><div class="fm">${fmtB(file.size)}</div></div></div>
      <div style="display:flex;gap:1rem;align-items:flex-start">
        <div style="flex:1;min-width:0">
          <div class="cb"><div><div class="cl">Share this code</div><div class="cv">${code}</div></div><button class="btn bg bsm" onclick="cpText('${code}',this)">Copy</button></div>
          <div class="slb">Or share this link</div>
          <div class="lr"><span class="lu" id="sl">${url}</span><button class="btn bg bsm" onclick="cpText($('sl').textContent,this)">Copy</button></div>
        </div>
        <div style="text-align:center;flex-shrink:0"><div class="qrw" id="qrc"></div><div style="font-size:.62rem;color:var(--m);margin-top:.3rem">Scan to receive</div></div>
      </div>
      <div class="stl" id="stl" style="display:flex;align-items:center;"><span class="dot dy pu"></span><span id="stx">Connecting…</span><span id="timer-val" style="margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:0.75rem;color:var(--m);">0s</span></div>
      <div id="dbg" style="font-family:'IBM Plex Mono',monospace;font-size:0.65rem;color:var(--m);background:rgba(0,0,0,0.2);padding:0.5rem;border-radius:6px;margin-top:0.5rem;max-height:100px;overflow-y:auto;text-align:left;display:none;line-height:1.4;"></div>
      <div id="pw" style="display:none"><div class="pw"><div class="pr"><span id="pl">Sending…</span><span style="display:flex;gap:.75rem"><span id="spd" style="color:var(--m)"></span><span id="eta" style="color:var(--m)"></span><span id="pct">0%</span></span></div><div class="pt"><div class="pf" id="pf" style="width:0%"></div></div></div></div>
    </div>`;
  $('fic').textContent=mIco(file.type);

function runSender(file,code){
  let pc=null,dc=null,ws=null,done=false,timer=null;
  startTimer();
  logD('Connecting to signaling server...');
  ws=new WebSocket(`${SIG}?code=${code}&role=sender`);
  ws.onopen=()=>{
    logD('Connected to signaling server.');
    logD('Waiting for receiver to join room...');
    setSt('Waiting — share the code or QR with the receiver','dy');
    pc=new RTCPeerConnection(ICE);
    dc=pc.createDataChannel('file',{ordered:true});
    dc.binaryType='arraybuffer';
    timer=setTimeout(()=>{ if(!done){ setSt('P2P connection timed out. Please check network compatibility (WiFi/Mobile Data).','dr'); logD('Error: Connection timed out.'); stopTimer(); } },P2P_TO);
    pc.onicecandidate=({candidate})=>{
      if(candidate&&ws.readyState===1) {
        logD('Gathered network route (ICE candidate)');
        ws.send(JSON.stringify({type:'ice',candidate}));
      }
    };
    pc.onconnectionstatechange=()=>{
      logD('Connection state changed: ' + pc.connectionState);
      if(['disconnected','failed','closed'].includes(pc.connectionState)&&!done) {
        setSt('Connection lost.','dr');
        stopTimer();
      }
    };
    dc.onopen=()=>{
      clearTimeout(timer);
      logD('Data channel opened! Sending metadata...');
      dc.send(JSON.stringify({type:'meta',name:file.name,size:file.size,mimeType:file.type||'application/octet-stream',nickname:localStorage.getItem('fs_nickname')||null}));
      setSt('Receiver reviewing — waiting for accept…','db');
    };
    dc.onmessage=e=>{
      if(typeof e.data!=='string')return;
      const m=JSON.parse(e.data);
      if(m.type==='accept'){
        logD('Receiver accepted file. Starting direct P2P stream...');
        setSt('Transferring via P2P…','dg');
        sendChunks(dc,file,()=>{
          done=true;
          stopTimer();
          showSendDonePersistent1to1(file, code, dc, pc, ws);
        });
      }
    };
    dc.onclose=()=>{
      logD('Data channel closed.');
      if(!done) { setSt('Channel closed.','dr'); stopTimer(); }
    };
    logD('Creating WebRTC connection offer...');
    pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>{
      logD('Offer created. Sending to signaling server...');
      ws.send(JSON.stringify({type:'offer',sdp:pc.localDescription}));
    }).catch(e=>{
      setSt('Error: '+e.message,'dr');
      logD('Offer Error: ' + e.message);
      stopTimer();
    });
  };
  let pIce=[];
  ws.onmessage=async({data})=>{
    const m=JSON.parse(data);
    if(m.type==='answer'){
      logD('Receiver joined! Received handshake answer.');
      setSt('Receiver found — forming P2P…','dy');
      await pc.setRemoteDescription(m.sdp).catch(()=>{});
      logD('Applying network routes...');
      for(const c of pIce){try{await pc.addIceCandidate(c);}catch{}}
      pIce=[];
    }
    else if(m.type==='ice'){
      logD('Received peer network route (ICE)');
      if(pc?.remoteDescription){try{await pc.addIceCandidate(m.candidate);}catch{}}else pIce.push(m.candidate);
    }
    else if(m.type==='peer-left'&&!done) {
      logD('Receiver disconnected.');
      setSt('Receiver disconnected.','dr');
      stopTimer();
    }
  };
  ws.onerror=()=>{
    logD('Error: Cannot connect to signaling server.');
    setSt('Cannot connect to signal server.','dr');
    stopTimer();
  };
}

function sendChunks(dc,file,onDone){
  let off=0,lastT=Date.now(),lastB=0,spd=0;
  const tick=()=>{
    if(off>=file.size){ dc.send(JSON.stringify({type:'done'})); onDone(); return; }
    if(dc.bufferedAmount>MAXBUF){ dc.bufferedAmountLowThreshold=MAXBUF/2; dc.onbufferedamountlow=()=>{ dc.onbufferedamountlow=null; tick(); }; return; }
    file.slice(off,off+CHUNK).arrayBuffer().then(buf=>{
      dc.send(buf); off+=buf.byteLength;
      const now=Date.now(),dt=now-lastT;
      if(dt>=400){ spd=((off-lastB)/dt)*1000; lastB=off; lastT=now; }
      const eta=spd>0?Math.round((file.size-off)/spd):0;
      setProg(off/file.size,'Sending…',spd,eta); tick();
    });
  };
  tick();
}

function uploadRelay(file,_code){
  const xhr=new XMLHttpRequest();
  xhr.open('POST','/api/relay/upload');
  xhr.setRequestHeader('X-File-Name',encodeURIComponent(file.name));
  xhr.setRequestHeader('X-File-Type',file.type||'application/octet-stream');
  xhr.setRequestHeader('X-File-Size',String(file.size));
  xhr.setRequestHeader('Content-Type',file.type||'application/octet-stream');
  let lL=0,lT=Date.now();
  xhr.upload.onprogress=e=>{ if(e.lengthComputable){ const now=Date.now(),dt=now-lT; let s=0,eta=0; if(dt>300){s=((e.loaded-lL)/dt)*1000;lL=e.loaded;lT=now;} if(s>0)eta=Math.round((e.total-e.loaded)/s); setProg(e.loaded/e.total,'Uploading to relay…',s,eta); }};
  xhr.onload=()=>{ if(xhr.status===201){ const{id}=JSON.parse(xhr.responseText); showSendDone(file,'relay',id); } else setSt('Relay upload failed.','dr'); };
  xhr.onerror=()=>setSt('Network error.','dr');
  xhr.send(file);
}

function runReceiver(code){
  let pc=null,ws=null,dc=null,meta=null;
  const chunks=[];let rcvd=0,spd=0,lR=0,lT=0;
  let pIce=[],accepted=false;
  startTimer();
  logD('Connecting to signaling server...');
  ws=new WebSocket(`${SIG}?code=${code}&role=receiver`);
  ws.onopen=()=>{
    logD('Connected to signaling server.');
    logD('Waiting for sender offer...');
    setSt('Connected — waiting for sender…','dy');
  };
  ws.onmessage=async({data})=>{
    const m=JSON.parse(data);
    if(m.type==='offer'){
      logD('Sender found! Received handshake offer.');
      setSt('Sender found — forming P2P…','dy');
      pc=new RTCPeerConnection(ICE);
      pc.onicecandidate=({candidate})=>{
        if(candidate&&ws.readyState===1) {
          logD('Gathered network route (ICE candidate)');
          ws.send(JSON.stringify({type:'ice',candidate}));
        }
      };
      pc.ondatachannel=({channel})=>{
        dc=channel; dc.binaryType='arraybuffer';
        logD('P2P signaling channel opened!');
        setSt('P2P connected!','dg');
        dc.onmessage=e=>{
          const d=e.data;
          if(typeof d==='string'){
            const msg=JSON.parse(d);
            if(msg.type==='meta'){
              meta=msg;
              logD(`Received metadata: "${msg.name}" (${fmtB(msg.size)})`);
              $('rico').textContent=mIco(msg.mimeType);
              $('rname').textContent=msg.name;
              $('rmeta').textContent=fmtB(msg.size)+(msg.mimeType?' · '+msg.mimeType:'')+(msg.nickname?' · From '+msg.nickname:'');
              $('finfo').style.display='block';
              setSt('File ready — click Accept','dg');
            }
            if(msg.type==='done'&&meta){
              logD('P2P download complete. Saving file...');
              setProg(1,'Saving…');
              const blob=new Blob(chunks,{type:meta.mimeType||'application/octet-stream'});
              active1to1Receiver.lastBlob = blob;
              active1to1Receiver.lastMeta = meta;
              showRecvDonePersistent1to1(meta, code, dc, pc, ws);
            }
          } else {
            if(!lT) { lT=Date.now(); logD('Receiving file data stream...'); }
            chunks.push(d); rcvd+=d.byteLength;
            const now=Date.now(),dt=now-lT;
            if(dt>=400){spd=((rcvd-lR)/dt)*1000;lR=rcvd;lT=now;}
            const eta=spd>0&&meta?.size?Math.round((meta.size-rcvd)/spd):0;
            if(meta?.size)setProg(rcvd/meta.size,'Receiving…',spd,eta);
          }
        };
        dc.onclose=()=>{
          logD('Data channel closed.');
          setSt('Channel closed.','dr');
          stopTimer();
        };
      };
      logD('Applying sender handshake...');
      await pc.setRemoteDescription(m.sdp).catch(()=>{});
      const ans=await pc.createAnswer().catch(()=>null);
      if(!ans) { logD('Error creating handshake answer.'); return; }
      logD('Creating handshake answer...');
      await pc.setLocalDescription(ans).catch(()=>{});
      logD('Sending answer to signaling server...');
      ws.send(JSON.stringify({type:'answer',sdp:pc.localDescription}));
      logD('Applying network routes...');
      for(const c of pIce){try{await pc.addIceCandidate(c);}catch{}} pIce=[];
    } else if(m.type==='ice'){
      logD('Received peer network route (ICE)');
      if(pc?.remoteDescription){try{await pc.addIceCandidate(m.candidate);}catch{}}else pIce.push(m.candidate);
    } else if(m.type==='peer-left') {
      logD('Sender disconnected.');
      setSt('Sender disconnected.','dr');
      stopTimer();
    }
  };
  ws.onerror=()=>{
    logD('Error: Cannot connect to signaling server.');
    setSt('Cannot connect to signal server.','dr');
    stopTimer();
  };
  window.doAccept=()=>{
    if(!dc||dc.readyState!=='open')return;
    logD('Accepting download. Starting stream request...');
    $('abtn').style.display='none'; $('pw').style.display='block';
    dc.send(JSON.stringify({type:'accept'})); setSt('Receiving…','dg');
  };
}

    xhr.onload=()=>{ if(xhr.status===200){saveBlob(xhr.response,info.name);showRecvDone(info,'relay');}else setSt('Download failed.','dr'); };
    xhr.onerror=()=>setSt('Network error.','dr'); xhr.send();

function runInboxReceiver(code) {
  startTimer();
  logD('Connecting to signaling server as Inbox...');
  inboxWs = new WebSocket(`${SIG}?code=${code}&role=inbox`);
  inboxWs._code = code;
  
  inboxWs.onopen = () => {
    logD('Inbox dashboard is live.');
    setSt('Dashboard live — waiting for senders…', 'dg');
    $('inbox-status').className = 'bdg bok';
    $('inbox-status').innerHTML = '<span class="dot dg pu"></span> Live Dashboard · 0 connected';
  };
  
  inboxWs.onmessage = async ({ data }) => {
    const m = JSON.parse(data);
    const senderId = m.senderId;
    
    if (m.type === 'peer-joined') {
      logD(`Sender joined: ${senderId}`);
      setupInboxPeer(code, senderId);
    }
    else if (m.type === 'offer') {
      logD(`Received offer from ${senderId}`);
      let peer = inboxPeers.get(senderId);
      if (!peer) {
        peer = setupInboxPeer(code, senderId);
      }
      const pc = peer.pc;
      await pc.setRemoteDescription(m.sdp).catch(()=>{});
      const ans = await pc.createAnswer().catch(()=>null);
      if (!ans) { logD(`Error creating answer for ${senderId}`); return; }
      await pc.setLocalDescription(ans).catch(()=>{});
      inboxWs.send(JSON.stringify({ type: 'answer', sdp: pc.localDescription, targetSenderId: senderId }));
    }
    else if (m.type === 'ice') {
      const peer = inboxPeers.get(senderId);
      if (peer && peer.pc) {
        if (peer.pc.remoteDescription) {
          try { await peer.pc.addIceCandidate(m.candidate); } catch {}
        } else {
          peer.pIce.push(m.candidate);
        }
      }
    }
    else if (m.type === 'peer-left') {
      logD(`Sender left: ${senderId}`);
      cleanupInboxPeer(senderId);
    }
  };
  
  inboxWs.onclose = () => {
    logD('Inbox signaling connection closed.');
    setSt('Dashboard disconnected.', 'dr');
    $('inbox-status').className = 'bdg bwn';
    $('inbox-status').innerHTML = '<span class="dot dr"></span> Disconnected';
    stopTimer();
  };
  
  inboxWs.onerror = () => {
    logD('Signaling server error.');
    setSt('Error connecting to signal server.', 'dr');
    stopTimer();
  };
}

function setupInboxPeer(code, senderId) {
  if (inboxPeers.has(senderId)) {
    cleanupInboxPeer(senderId);
  }
  
  const pc = new RTCPeerConnection(ICE);
  const peer = {
    pc,
    dc: null,
    chunks: [],
    meta: null,
    pIce: [],
    elId: 'file-' + senderId + '-' + Date.now(),
    accepted: false,
    lT: 0, lR: 0, spd: 0
  };
  
  inboxPeers.set(senderId, peer);
  updateInboxConnectedCount();
  
  pc.onicecandidate = ({ candidate }) => {
    if (candidate && inboxWs && inboxWs.readyState === 1) {
      inboxWs.send(JSON.stringify({ type: 'ice', candidate, targetSenderId: senderId }));
    }
  };
  
  pc.ondatachannel = ({ channel }) => {
    peer.dc = channel;
    peer.dc.binaryType = 'arraybuffer';
    logD(`P2P channel with ${senderId} opened.`);
    
    peer.pIce.forEach(async c => {
      try { await pc.addIceCandidate(c); } catch {}
    });
    peer.pIce = [];
    
    channel.onmessage = e => {
      const d = e.data;
      if (typeof d === 'string') {
        const msg = JSON.parse(d);
        if (msg.type === 'meta') {
          peer.meta = msg;
          peer.chunks = [];
          peer.lT = 0; peer.lR = 0; peer.spd = 0;
          const displayName = msg.nickname ? `${msg.nickname} (${senderId.slice(0, 8)})` : senderId.slice(0, 8);
          logD(`Incoming file from ${displayName}: "${msg.name}" (${fmtB(msg.size)})`);
          
          const ph = $('inbox-placeholder');
          if (ph) ph.remove();
          
          renderInboxFileEntry(senderId, peer);
          
          if ($('auto-accept')?.checked) {
            acceptInboxFile(senderId);
          }
        }
        else if (msg.type === 'done') {
          const displayName = peer.meta.nickname ? `${peer.meta.nickname} (${senderId.slice(0, 8)})` : senderId.slice(0, 8);
          logD(`P2P download from ${displayName} complete.`);
          const blob = new Blob(peer.chunks, { type: peer.meta.mimeType || 'application/octet-stream' });
          peer.blob = blob;
          updateInboxFileProgress(senderId, 1, 'Completed', 0, 0);
          if ($('auto-accept')?.checked) {
            saveBlob(blob, peer.meta.name);
          }
          peer.chunks = [];
        }
      } else {
        if (!peer.lT) peer.lT = Date.now();
        peer.chunks.push(d);
        const rcvd = peer.chunks.reduce((acc, chunk) => acc + chunk.byteLength, 0);
        const now = Date.now();
        const dt = now - peer.lT;
        if (dt >= 400) {
          peer.spd = ((rcvd - peer.lR) / dt) * 1000;
          peer.lR = rcvd;
          peer.lT = now;
        }
        const eta = peer.spd > 0 && peer.meta ? Math.round((peer.meta.size - rcvd) / peer.spd) : 0;
        updateInboxFileProgress(senderId, rcvd / peer.meta.size, 'Downloading', peer.spd, eta);
      }
    };
    
    channel.onclose = () => {
      logD(`P2P channel with ${senderId} closed.`);
      updateInboxFileProgress(senderId, null, 'Closed', 0, 0);
    };
  };
  
  return peer;
}

function updateInboxConnectedCount() {
  const activeCount = Array.from(inboxPeers.values()).filter(p => p.pc.connectionState !== 'closed').length;
  const el = $('inbox-status');
  if (el) {
    el.innerHTML = `<span class="dot dg pu"></span> Live Dashboard · ${activeCount} connected`;
  }
}

function acceptInboxFile(senderId) {
  const peer = inboxPeers.get(senderId);
  if (!peer || !peer.dc || peer.dc.readyState !== 'open') return;
  
  peer.accepted = true;
  $(`accept-row-${peer.elId}`).style.display = 'none';
  $(`progress-row-${peer.elId}`).style.display = 'block';
  
  const badge = $(`badge-${peer.elId}`);
  if (badge) {
    badge.className = 'bdg binf';
    badge.textContent = 'Connecting';
  }
  
  peer.dc.send(JSON.stringify({ type: 'accept' }));
}

function rejectInboxFile(senderId) {
  const peer = inboxPeers.get(senderId);
  if (!peer) return;
  
  const entry = $(peer.elId);
  if (entry) entry.remove();
  
  if (peer.dc && peer.dc.readyState === 'open') {
    peer.dc.send(JSON.stringify({ type: 'reject' }));
    peer.dc.close();
  }
  cleanupInboxPeer(senderId);
}

function updateInboxFileProgress(senderId, ratio, status, speed, eta) {
  const peer = inboxPeers.get(senderId);
  if (!peer) return;
  
  const badge = $(`badge-${peer.elId}`);
  if (badge) {
    if (status === 'Downloading') {
      badge.className = 'bdg binf';
      badge.textContent = 'Downloading';
      $(`accept-row-${peer.elId}`).style.display = 'none';
      $(`progress-row-${peer.elId}`).style.display = 'block';
    } else if (status === 'Completed') {
      badge.className = 'bdg bok';
      badge.textContent = 'Completed';
      $(`progress-row-${peer.elId}`).style.display = 'block';
      $(`label-${peer.elId}`).textContent = 'Saved';
      $(`percent-${peer.elId}`).textContent = '100%';
      $(`bar-${peer.elId}`).style.width = '100%';
      $(`speed-${peer.elId}`).textContent = '';
      $(`eta-${peer.elId}`).textContent = '';
      
      $(`accept-row-${peer.elId}`).style.display = 'none';
      $(`completed-row-${peer.elId}`).style.display = 'flex';
      
      const isPreviewable = peer.meta && peer.meta.mimeType && (peer.meta.mimeType.startsWith('image/') || peer.meta.mimeType.startsWith('audio/') || peer.meta.mimeType.startsWith('video/'));
      if (isPreviewable) {
        $(`preview-btn-${peer.elId}`).style.display = 'block';
      }
      
      setTimeout(() => {
        const pr = $(`progress-row-${peer.elId}`);
        if (pr) pr.style.display = 'none';
      }, 3000);
    } else if (status === 'Closed' || status === 'Disconnected') {
      badge.className = 'bdg bwn';
      badge.textContent = 'Disconnected';
      $(`accept-row-${peer.elId}`).style.display = 'none';
    }
  }
  
  if (ratio !== null && status === 'Downloading') {
    const pct = Math.round(ratio * 100);
    const bar = $(`bar-${peer.elId}`);
    const percent = $(`percent-${peer.elId}`);
    const spdEl = $(`speed-${peer.elId}`);
    const etaEl = $(`eta-${peer.elId}`);
    
    if (bar) bar.style.width = ratio * 100 + '%';
    if (percent) percent.textContent = pct + '%';
    if (spdEl) spdEl.textContent = speed ? fmtS(speed) : '';
    if (etaEl) etaEl.textContent = eta ? fmtE(eta) : '';
  }
}

function cleanupInboxPeer(senderId) {
  const peer = inboxPeers.get(senderId);
  if (!peer) return;
  
  if (peer.pc) {
    peer.pc.close();
  }
  
  const badge = $(`badge-${peer.elId}`);
  if (badge) {
    badge.className = 'bdg bwn';
    badge.textContent = 'Disconnected';
  }
  
  const acceptRow = $(`accept-row-${peer.elId}`);
  if (acceptRow) acceptRow.style.display = 'none';
  
  inboxPeers.delete(senderId);
  updateInboxConnectedCount();
}

function closeInbox() {
  if (inboxWs) {
    inboxWs.close();
    inboxWs = null;
  }
  for (const [senderId] of inboxPeers) {
    cleanupInboxPeer(senderId);
  }
  inboxPeers.clear();
  showHome();
}

function startInboxSenderFlow(file, code) {
  if (activeInboxSender.code === code && activeInboxSender.connected && activeInboxSender.dc && activeInboxSender.dc.readyState === 'open') {

    sendInboxFileDirectly(file);
  } else {
    cleanupActiveInboxSender();
    const senderId = 's_' + genC();
    activeInboxSender = { code, senderId, ws: null, pc: null, dc: null, connected: false };
    showInboxSenderProgressUI(file, code);
    connectInboxSender(file, code, senderId);
  }
}

function connectInboxSender(file, code, senderId) {
  let ws, pc, dc;
  startTimer();
  logD('Connecting to signaling server...');
  ws = new WebSocket(`${SIG}?code=${code}&role=sender&senderId=${senderId}&isInbox=true`);
  activeInboxSender.ws = ws;
  
  ws.onopen = () => {
    logD('Connected to signaling server.');
    logD('Waiting for inbox receiver to respond...');
    setSt('Waiting for inbox receiver...', 'dy');
    
    pc = new RTCPeerConnection(ICE);
    activeInboxSender.pc = pc;
    
    dc = pc.createDataChannel('file', { ordered: true });
    dc.binaryType = 'arraybuffer';
    activeInboxSender.dc = dc;
    
    let timer = setTimeout(() => {
      if (!activeInboxSender.connected) {
        setSt('P2P connection timed out.', 'dr');
        logD('Error: Connection timed out.');
        stopTimer();
      }
    }, P2P_TO);
    
    pc.onicecandidate = ({ candidate }) => {
      if (candidate && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: 'ice', candidate, targetSenderId: senderId }));
      }
    };
    
    pc.onconnectionstatechange = () => {
      logD('Connection state: ' + pc.connectionState);
      if (['disconnected', 'failed', 'closed'].includes(pc.connectionState)) {
        activeInboxSender.connected = false;
        setSt('Connection lost.', 'dr');
        stopTimer();
      }
    };
    
    dc.onopen = () => {
      clearTimeout(timer);
      activeInboxSender.connected = true;
      logD('P2P channel opened! Sending metadata...');
      setSt('Connected! Sending metadata...', 'dg');
      sendInboxFileDirectly(file);
    };
    
    dc.onmessage = e => {
      if (typeof e.data !== 'string') return;
      const m = JSON.parse(e.data);
      if (m.type === 'accept') {
        logD('Inbox receiver accepted file. Starting direct P2P stream...');
        setSt('Transferring via P2P…', 'dg');
        $('pw').style.display = 'block';
        sendChunks(dc, file, () => {
          logD('File transfer complete.');
          stopTimer();
          showInboxSendDone(file, code);
        });
      } else if (m.type === 'reject') {
        logD('Inbox receiver rejected file.');
        setSt('File rejected by receiver.', 'dr');
        stopTimer();
      }
    };
    
    dc.onclose = () => {
      logD('Data channel closed.');
      activeInboxSender.connected = false;
      setSt('Channel closed.', 'dr');
      stopTimer();
    };
    
    logD('Creating connection offer...');
    pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => {
      ws.send(JSON.stringify({ type: 'offer', sdp: pc.localDescription, senderId }));
    }).catch(err => {
      setSt('Offer Error: ' + err.message, 'dr');
      logD('Offer Error: ' + err.message);
      stopTimer();
    });
  };
  
  let pIce = [];
  ws.onmessage = async ({ data }) => {
    const m = JSON.parse(data);
    if (m.type === 'answer') {
      logD('Inbox receiver answered handshake.');
      setSt('Inbox receiver found — forming P2P…', 'dy');
      await pc.setRemoteDescription(m.sdp).catch(() => {});
      for (const c of pIce) { try { await pc.addIceCandidate(c); } catch {} }
      pIce = [];
    } else if (m.type === 'ice') {
      if (pc?.remoteDescription) {
        try { await pc.addIceCandidate(m.candidate); } catch {}
      } else {
        pIce.push(m.candidate);
      }
    } else if (m.type === 'peer-left') {
      logD('Inbox receiver disconnected.');
      setSt('Inbox receiver disconnected.', 'dr');
      stopTimer();
    }
  };
  
  ws.onerror = () => {
    logD('Error connecting to signal server.');
    setSt('Cannot connect to signaling server.', 'dr');
    stopTimer();
  };
}

function sendInboxFileDirectly(file) {
  const dc = activeInboxSender.dc;
  if (!dc || dc.readyState !== 'open') return;
  
  dc.send(JSON.stringify({
    type: 'meta',
    name: file.name,
    size: file.size,
    mimeType: file.type || 'application/octet-stream',
    nickname: localStorage.getItem('fs_nickname') || null
  }));
  
  dc.onmessage = e => {
    if (typeof e.data !== 'string') return;
    const m = JSON.parse(e.data);
    if (m.type === 'accept') {
      logD('Inbox receiver accepted file. Starting direct P2P stream...');
      setSt('Transferring via P2P…', 'dg');
      $('pw').style.display = 'block';
      sendChunks(dc, file, () => {
        logD('File transfer complete.');
        stopTimer();
        showInboxSendDone(file, activeInboxSender.code);
      });
    } else if (m.type === 'reject') {
      logD('Inbox receiver rejected file.');
      setSt('File rejected by receiver.', 'dr');
      stopTimer();
    }
  };
}

        <div class="dzt">Drop another file here</div>
        <div class="dzs">to send instantly without reconnecting</div>
        <input type="file" id="fi" style="display:none" onchange="onFPInbox(event, '${code}')">
      </div>
      
      <div style="display:flex; gap:0.5rem; margin-top:1rem;">
        <button class="btn bg" onclick="showHome()" style="flex:1;">← Minimize</button>
        <button class="btn bg" onclick="cancelInboxSender('${code}')" style="border-color:var(--er); color:var(--er); width:auto; padding:0 1rem;">Disconnect</button>
      </div>
    </div>`;
}

function cleanupActiveInboxSender() {
  if (activeInboxSender.ws) activeInboxSender.ws.close();
  if (activeInboxSender.pc) activeInboxSender.pc.close();
  activeInboxSender = { code: null, senderId: null, ws: null, pc: null, dc: null, connected: false };
}

function cancelInboxSender(code) {
  cleanupActiveInboxSender();
  showHome();
}

function showSendDonePersistent1to1(file, code, dc, pc, ws) {
  active1to1Sender = { code, dc, pc, ws, lastFile: file };
  
  root().innerHTML = `
    <div class="card fade" style="text-align:center">
      <div class="dic">✅</div>
      <div style="font-family:Syne,sans-serif;font-size:1.05rem;font-weight:700;margin-bottom:.4rem">File sent!</div>
      <p style="font-size:.8rem;color:var(--m);margin-bottom:1.25rem"><strong>${file.name}</strong> (${fmtB(file.size)}) sent successfully</p>
      
      <div style="margin-bottom:1.25rem"><span class="mtg mp">⚡ Direct P2P — connected</span></div>
      
      <div class="div"></div>
      
      <div style="font-family:Syne,sans-serif;font-size:0.9rem;font-weight:700;margin-bottom:0.75rem;text-align:left;">Send another file to this receiver:</div>
      <div class="dz" id="dz" onclick="$('fi').click()" ondragover="event.preventDefault();this.classList.add('ov')" ondragleave="this.classList.remove('ov')" ondrop="onDrop1to1Persistent(event)">
        <div class="dzi"><svg viewBox="0 0 44 44" fill="none"><path d="M22 8v22M12 18l10-10 10 10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 36h28" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></div>
        <div class="dzt">Drop another file here</div>
        <div class="dzs">to send instantly over the same connection</div>
        <input type="file" id="fi" style="display:none" onchange="onFP1to1Persistent(event)">
      </div>
      
      <div style="display:flex; gap:0.5rem; margin-top:1rem;">
        <button class="btn bg" onclick="showHome()" style="flex:1;">← Minimize</button>
        <button class="btn bg" onclick="disconnect1to1Sender()" style="border-color:var(--er); color:var(--er); width:auto; padding:0 1rem;">Disconnect</button>
      </div>
    </div>`;
}

function onDrop1to1Persistent(e) {
  e.preventDefault(); e.currentTarget.classList.remove('ov');
  const f = e.dataTransfer.files?.[0]; if (f) send1to1PersistentFile(f);
}
function onFP1to1Persistent(e) {
  const f = e.target.files?.[0]; if (f) send1to1PersistentFile(f);
}

function send1to1PersistentFile(file) {
  const { code, dc, pc, ws } = active1to1Sender;
  if (!dc || dc.readyState !== 'open') {
    startSend(file);
    return;
  }
  
  root().innerHTML=`
    <div class="card fade">
      <div class="rsb" style="margin-bottom:1rem">
        <span class="bdg binf"><span class="dot db pu"></span> Sending another file</span>
        <button class="btn bg bsm" onclick="disconnect1to1Sender()">Disconnect</button>
      </div>
      <div class="fr"><span class="fic" id="fic">📁</span><div><div class="fn">${file.name}</div><div class="fm">${fmtB(file.size)}</div></div></div>
      <div class="stl" id="stl" style="display:flex;align-items:center;"><span class="dot dy pu"></span><span id="stx">Offering file to receiver…</span><span id="timer-val" style="margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:0.75rem;color:var(--m);">0s</span></div>
      <div id="dbg" style="font-family:'IBM Plex Mono',monospace;font-size:0.65rem;color:var(--m);background:rgba(0,0,0,0.2);padding:0.5rem;border-radius:6px;margin-top:0.5rem;max-height:100px;overflow-y:auto;text-align:left;display:none;line-height:1.4;"></div>
      <div id="pw" style="display:none"><div class="pw"><div class="pr"><span id="pl">Sending…</span><span style="display:flex;gap:.75rem"><span id="spd" style="color:var(--m)"></span><span id="eta" style="color:var(--m)"></span><span id="pct">0%</span></span></div><div class="pt"><div class="pf" id="pf" style="width:0%"></div></div></div></div>
    </div>`;
  $('fic').textContent=mIco(file.type);
  
  startTimer();
  logD('Sending metadata for new file...');
  dc.send(JSON.stringify({ type: 'meta', name: file.name, size: file.size, mimeType: file.type || 'application/octet-stream', nickname: localStorage.getItem('fs_nickname') || null }));
  setSt('Receiver reviewing — waiting for accept…', 'db');
  
  dc.onmessage = e => {
    if (typeof e.data !== 'string') return;
    const m = JSON.parse(e.data);
    if (m.type === 'accept') {
      logD('Receiver accepted file. Starting direct P2P stream...');
      setSt('Transferring via P2P…', 'dg');
      $('pw').style.display = 'block';
      sendChunks(dc, file, () => {
        logD('File transfer complete.');
        stopTimer();
        showSendDonePersistent1to1(file, code, dc, pc, ws);
      });
    }
  };
}

function disconnect1to1Sender() {
  if (active1to1Sender.ws) active1to1Sender.ws.close();
  if (active1to1Sender.pc) active1to1Sender.pc.close();
  active1to1Sender = { code: null, dc: null, pc: null, ws: null };
  showHome();
}

function showRecvDonePersistent1to1(lastMeta, code, dc, pc, ws) {
  active1to1Receiver = { code, dc, pc, ws, chunks: [], lastMeta, lastBlob: active1to1Receiver.lastBlob || null };
  
  const hasFile = lastMeta && lastMeta.size > 0;
  const isPreviewable = hasFile && lastMeta.mimeType && (lastMeta.mimeType.startsWith('image/') || lastMeta.mimeType.startsWith('audio/') || lastMeta.mimeType.startsWith('video/'));
  
  root().innerHTML = `
    <div class="card fade">
      <div class="rsb" style="margin-bottom: 1rem">
        <span class="bdg bok"><span class="dot dg pu"></span> Connected to Sender</span>
        <div style="display:flex; gap:0.5rem">
          <button class="btn bg bsm" onclick="showHome()">← Minimize</button>
          <button class="btn bg bsm" onclick="disconnect1to1Receiver()" style="border-color:var(--er); color:var(--er);">Disconnect</button>
        </div>
      </div>
      
      ${hasFile ? `
        <div class="dic" style="margin-bottom:0.4rem">⬇️</div>
        <div style="font-family:Syne,sans-serif;font-size:1.05rem;font-weight:700;margin-bottom:.4rem;text-align:center;">Download complete</div>
        <p style="font-size:.8rem;color:var(--m);margin-bottom:1rem;text-align:center;"><strong>${lastMeta.name}</strong> (${fmtB(lastMeta.size)}) saved</p>
        
        <div style="display:flex; gap:0.5rem; justify-content:center; margin-bottom:1.25rem;">
          ${isPreviewable ? `<button class="btn ba bsm" onclick="preview1to1File()">👁️ Preview</button>` : ''}
          <button class="btn bg bsm" onclick="delete1to1File()" style="border-color:var(--er); color:var(--er);">Delete</button>
        </div>
      ` : `
        <div class="dic" style="margin-bottom:0.4rem">📁</div>
        <div style="font-family:Syne,sans-serif;font-size:1.05rem;font-weight:700;margin-bottom:.4rem;text-align:center;">Waiting for transfer</div>
      `}
      
      <div class="div"></div>
      
      <div id="recv-waiting-msg" style="text-align:center; padding:1.5rem 1rem; color:var(--m); font-size:0.8rem; border:1px dashed var(--b); border-radius:var(--r);">
        <span class="dot dg pu" style="display:inline-block; vertical-align:middle; margin-right:0.35rem; width:6px; height:6px;"></span>
        Waiting for sender to send another file...
      </div>
      
      <div id="finfo" style="display:none">
        <div class="fr"><span class="fic" id="rico">📁</span><div><div class="fn" id="rname">—</div><div class="fm" id="rmeta">—</div></div></div>
        <button class="btn ba" id="abtn" onclick="doAccept1to1Persistent()">⬇️ Accept &amp; Download</button>
      </div>
      
      <div id="pw" style="display:none"><div class="pw"><div class="pr"><span id="pl">Receiving…</span><span style="display:flex;gap:.75rem"><span id="spd" style="color:var(--m)"></span><span id="eta" style="color:var(--m)"></span><span id="pct">0%</span></span></div><div class="pt"><div class="pf" id="pf" style="width:0%"></div></div></div></div>
      
      <div class="stl" id="stl" style="display:flex;align-items:center;margin-top:1rem;"><span class="dot dg pu"></span><span id="stx">Ready for next transfer</span><span id="timer-val" style="margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:0.75rem;color:var(--m);">0s</span></div>
      <div id="dbg" style="font-family:'IBM Plex Mono',monospace;font-size:0.65rem;color:var(--m);background:rgba(0,0,0,0.2);padding:0.5rem;border-radius:6px;margin-top:0.5rem;max-height:100px;overflow-y:auto;text-align:left;display:none;line-height:1.4;"></div>
    </div>`;
  
  setup1to1ReceiverDC(dc, lastMeta);
}

function setup1to1ReceiverDC(dc, lastMeta) {
  let meta = null;
  let rcvd = 0;
  let spd = 0, lR = 0, lT = 0;
  
  dc.onmessage = e => {
    const d = e.data;
    if (typeof d === 'string') {
      const msg = JSON.parse(d);
      if (msg.type === 'meta') {
        meta = msg;
        active1to1Receiver.chunks = [];
        rcvd = 0; spd = 0; lR = 0; lT = 0;
        
        logD(`Received new metadata: "${msg.name}" (${fmtB(msg.size)})`);
        
        const waitingMsg = $('recv-waiting-msg');
        if (waitingMsg) waitingMsg.style.display = 'none';
        
        $('rico').textContent = mIco(msg.mimeType);
        $('rname').textContent = msg.name;
        $('rmeta').textContent = fmtB(msg.size) + (msg.mimeType ? ' · ' + msg.mimeType : '') + (msg.nickname ? ' · From ' + msg.nickname : '');
        $('finfo').style.display = 'block';
        $('abtn').style.display = 'block';
        $('pw').style.display = 'none';
        
        setSt('New file ready — click Accept', 'dg');
      }
      else if (msg.type === 'done' && meta) {
        logD('P2P download complete. Saving file...');
        setProg(1, 'Saving…');
        const blob = new Blob(active1to1Receiver.chunks, { type: meta.mimeType || 'application/octet-stream' });
        active1to1Receiver.lastBlob = blob;
        active1to1Receiver.lastMeta = meta;
        showRecvDonePersistent1to1(meta, active1to1Receiver.code, active1to1Receiver.dc, active1to1Receiver.pc, active1to1Receiver.ws);
      }
    } else {
      if (!lT) { lT = Date.now(); logD('Receiving file data stream...'); }
      active1to1Receiver.chunks.push(d);
      rcvd += d.byteLength;
      const now = Date.now();
      const dt = now - lT;
      if (dt >= 400) {
        spd = ((rcvd - lR) / dt) * 1000;
        lR = rcvd;
        lT = now;
      }
      const eta = spd > 0 && meta?.size ? Math.round((meta.size - rcvd) / spd) : 0;
      if (meta?.size) setProg(rcvd / meta.size, 'Receiving…', spd, eta);
    }
  };
  
  dc.onclose = () => {
    logD('Data channel closed.');
    setSt('Sender disconnected.', 'dr');
    stopTimer();
  };
}

function doAccept1to1Persistent() {
  const dc = active1to1Receiver.dc;
  if (!dc || dc.readyState !== 'open') return;
  
  logD('Accepting download. Starting stream request...');
  $('abtn').style.display = 'none';
  $('pw').style.display = 'block';
  
  dc.send(JSON.stringify({ type: 'accept' }));
  setSt('Receiving…', 'dg');
}

function disconnect1to1Receiver() {
  if (active1to1Receiver.ws) active1to1Receiver.ws.close();
  if (active1to1Receiver.pc) active1to1Receiver.pc.close();
  active1to1Receiver = { code: null, dc: null, pc: null, ws: null, chunks: [] };
  showHome();
}

function showSendToInbox(){
  stopTimer();
  const savedNickname = localStorage.getItem('fs_nickname') || '';
  root().innerHTML=`
    <div class="card fade">
      <div class="rsb" style="margin-bottom:1.25rem">
        <span style="font-family:Syne,sans-serif;font-size:1rem;font-weight:700">Send to Inbox</span>
        <button class="btn bg bsm" onclick="showHome()">← Back</button>
      </div>
      <div class="slb" style="margin-bottom:0.15rem">Your Nickname (Optional)</div>
      <input class="ci" id="sender-nickname" placeholder="NICKNAME (OPTIONAL)" value="${savedNickname}" style="font-size:1.1rem;letter-spacing:0.05em;padding:0.6rem;text-transform:uppercase;margin:0.4rem 0 1rem;" autocomplete="off" spellcheck="false" maxlength="15" oninput="localStorage.setItem('fs_nickname',this.value.trim())">
      
      <div class="slb" style="margin-bottom:0.15rem">Enter the 6-character Inbox Code</div>
      <input class="ci" id="ib-code" maxlength="6" placeholder="ABC123" autocomplete="off" spellcheck="false" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')" onkeydown="if(event.key==='Enter')tryConnectInbox()" style="margin:0.4rem 0 1rem;">
      <button class="btn ba" onclick="tryConnectInbox()">Next →</button>
    </div>`;
  setTimeout(()=>$('ib-code')?.focus(),50);
}

function tryConnectInbox(){
  const c=($('ib-code')?.value||'').trim().toUpperCase();
  if(c.length!==6){
    const el=$('ib-code');
    if(!el)return;
    el.style.borderColor='var(--er)';
    setTimeout(()=>el.style.borderColor='',1400);
    return;
  }
  const nn = ($('sender-nickname')?.value || '').trim();
  localStorage.setItem('fs_nickname', nn);
  startInboxSender(c);
}

function getActiveSessionType() {
  if (inboxWs && inboxWs.readyState === 1) return { type: 'inbox', code: inboxWs._code };
  if (active1to1Sender.ws && active1to1Sender.ws.readyState === 1) return { type: '1to1sender', code: active1to1Sender.code };
  if (active1to1Receiver.ws && active1to1Receiver.ws.readyState === 1) return { type: '1to1receiver', code: active1to1Receiver.code };
  if (activeInboxSender.ws && activeInboxSender.ws.readyState === 1) return { type: 'inboxsender', code: activeInboxSender.code };
  return null;
}

function resumeActiveSession() {
  const s = getActiveSessionType();
  if (!s) return;
  if (s.type === 'inbox') showInboxDashboard(s.code);
  if (s.type === '1to1sender') {
    showSendDonePersistent1to1(active1to1Sender.lastFile || { name: 'File', size: 0 }, s.code, active1to1Sender.dc, active1to1Sender.pc, active1to1Sender.ws);
  }
  if (s.type === '1to1receiver') {
    showRecvDonePersistent1to1(active1to1Receiver.lastMeta || { name: 'File', size: 0 }, s.code, active1to1Receiver.dc, active1to1Receiver.pc, active1to1Receiver.ws);
  }
  if (s.type === 'inboxsender') {
    showInboxSendDone(activeInboxSender.lastFile || { name: 'File', size: 0 }, s.code);
  }
}

function previewInboxFile(senderId) {
  const peer = inboxPeers.get(senderId);
  if (peer && peer.blob && peer.meta) {
    showPreviewModal(peer.blob, peer.meta.name);
  }
}

function downloadInboxFile(senderId) {
  const peer = inboxPeers.get(senderId);
  if (peer && peer.blob && peer.meta) {
    saveBlob(peer.blob, peer.meta.name);
  }
}

function deleteInboxFile(senderId, elId) {
  const el = $(elId);
  if (el) el.remove();
  
  const peer = inboxPeers.get(senderId);
  if (peer) {
    peer.blob = null;
    peer.chunks = [];
  }
  
  const fileContainer = $('inbox-files');
  if (fileContainer && fileContainer.children.length === 0) {
    fileContainer.innerHTML = `
      <div id="inbox-placeholder" style="text-align:center; color:var(--m2); font-size:0.8rem; padding:2rem 1rem; border:1px dashed var(--b); border-radius:var(--r);">
        No files dropped yet.<br>Scan the QR or open the link on another device to start sending.
      </div>`;
  }
}

function preview1to1File() {
  if (active1to1Receiver.lastBlob && active1to1Receiver.lastMeta) {
    showPreviewModal(active1to1Receiver.lastBlob, active1to1Receiver.lastMeta.name);
  }
}

function download1to1File() {
  if (active1to1Receiver.lastBlob && active1to1Receiver.lastMeta) {
    saveBlob(active1to1Receiver.lastBlob, active1to1Receiver.lastMeta.name);
  }
}

function delete1to1File() {
  active1to1Receiver.lastBlob = null;
  showRecvDonePersistent1to1(null, active1to1Receiver.code, active1to1Receiver.dc, active1to1Receiver.pc, active1to1Receiver.ws);
}

function showPreviewModal(blob, name) {
  const url = URL.createObjectURL(blob);
  const mime = blob.type;
  
  let content = '';
  if (mime.startsWith('image/')) {
    content = `<img src="${url}" style="max-width:100%; max-height:70vh; border-radius:8px; display:block; margin:0 auto; box-shadow:0 4px 20px rgba(0,0,0,0.5);">`;
  } else if (mime.startsWith('audio/')) {
    content = `<audio controls autoplay src="${url}" style="width:100%; margin-top:1rem;"></audio>`;
  } else if (mime.startsWith('video/')) {
    content = `<video controls autoplay src="${url}" style="max-width:100%; max-height:70vh; border-radius:8px; display:block; margin:0 auto;"></video>`;
  } else {
    content = `<div style="text-align:center; padding:2rem; color:var(--m);">Preview not supported for this file type.</div>`;
  }
  
  const modal = document.createElement('div');
  modal.id = 'preview-modal';
  modal.style.cssText = 'position:fixed; inset:0; background:rgba(7,7,14,0.85); backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; z-index:9999; padding:1.5rem;';
  modal.innerHTML = `
    <div class="card fade" style="width:100%; max-width:600px; background:var(--bg2); border:1px solid var(--b); position:relative; padding:1.5rem;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <span style="font-family:Syne,sans-serif; font-size:0.95rem; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:80%;">${name}</span>
        <button class="btn bg bsm" onclick="closePreviewModal()" style="border-radius:50%; width:30px; height:30px; padding:0; display:flex; align-items:center; justify-content:center;">✕</button>
      </div>
      <div style="background:rgba(0,0,0,0.3); border-radius:var(--r); padding:1rem; display:flex; align-items:center; justify-content:center; min-height:150px;">
        ${content}
      </div>
      <div style="display:flex; gap:0.5rem; margin-top:1rem;">
        <a href="${url}" download="${name}" class="btn ba" style="text-decoration:none; flex:1; text-align:center; display:flex; align-items:center; justify-content:center;">Save to Device</a>
      </div>
    </div>`;
  
  document.body.appendChild(modal);
  window.closePreviewModal = () => {
    modal.remove();
    URL.revokeObjectURL(url);
  };
}

showHome();
</script>
</body>
</html>
